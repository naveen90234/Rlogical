name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

# Prevent concurrent runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  IMAGE_NAME: nodejs-app
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  APP_PORT: 3000

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Stage 1 — Application Preparation
  # ═══════════════════════════════════════════════════════════════
  prepare:
    name: "Stage 1 — App Preparation"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Run tests (if available)
        run: |
          if [ -f "package.json" ] && grep -q '"test"' package.json; then
            echo "Running tests..."
            npm test -- --passWithNoTests --forceExit 2>/dev/null || npm test
          else
            echo "No test script found in package.json — skipping tests."
          fi

      - name: Cache node_modules for subsequent jobs
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

  # ═══════════════════════════════════════════════════════════════
  # Stage 2 — Code Quality (SonarQube)
  # ═══════════════════════════════════════════════════════════════
  code-quality:
    name: "Stage 2 — Code Quality (SonarQube)"
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for accurate SonarQube blame info

      - name: Run SonarQube analysis
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          # SONAR_TOKEN and SONAR_HOST_URL are stored as GitHub Actions secrets
          # — never hard-coded here.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.event.repository.name }}
            -Dsonar.projectName=${{ github.event.repository.name }}
            -Dsonar.sources=src
            -Dsonar.exclusions=node_modules/**,dist/**,coverage/**,**/*.test.js,**/*.spec.js

      - name: Check SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ═══════════════════════════════════════════════════════════════
  # Stage 3 — Docker Build
  # ═══════════════════════════════════════════════════════════════
  docker-build:
    name: "Stage 3 — Docker Build"
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      image-tag: ${{ steps.set-tag.outputs.image-tag }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: |
          # Tag format: <short-sha>  (e.g. a1b2c3d)
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "image-tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${SHORT_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.image-tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image to tarball
        run: |
          docker save "${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.image-tag }}" \
            -o /tmp/image.tar

      - name: Upload image tarball as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════
  # Stage 4 — Container Security Scan (Trivy)
  # ═══════════════════════════════════════════════════════════════
  security-scan:
    name: "Stage 4 — Security Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/image.tar

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ needs.docker-build.outputs.image-tag }}"
          format: "table"
          output: "trivy-results.txt"
          # Pipeline fails on HIGH or CRITICAL vulnerabilities
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true

      - name: Upload Trivy scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.txt
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # Stage 5 — Push to AWS ECR
  # ═══════════════════════════════════════════════════════════════
  push-to-ecr:
    name: "Stage 5 — Push to AWS ECR"
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan]
    # Only push on merges to main, not on PRs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/image.tar

      - name: Configure AWS credentials (via OIDC — no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Use GitHub OIDC federation — no AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY stored as secrets.
          # The IAM Role ARN is the only secret needed.
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to ECR
        run: |
          ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          IMAGE_TAG="${{ needs.docker-build.outputs.image-tag }}"
          FULL_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          LATEST_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          docker tag "${{ env.IMAGE_NAME }}:${IMAGE_TAG}" "${FULL_IMAGE}"
          docker tag "${{ env.IMAGE_NAME }}:${IMAGE_TAG}" "${LATEST_IMAGE}"

          docker push "${FULL_IMAGE}"
          docker push "${LATEST_IMAGE}"

          echo "Pushed: ${FULL_IMAGE}"
          echo "Pushed: ${LATEST_IMAGE}"

          # Pass full image URI to the deploy job
          echo "FULL_IMAGE=${FULL_IMAGE}" >> "$GITHUB_ENV"

  # ═══════════════════════════════════════════════════════════════
  # Stage 6 — Deploy to EC2
  # ═══════════════════════════════════════════════════════════════
  deploy:
    name: "Stage 6 — Deploy to EC2"
    runs-on: ubuntu-latest
    needs: push-to-ecr
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Configure AWS credentials (via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR (for pull token)
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          # SSH private key is stored as a GitHub Actions secret — never committed
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          script: |
            set -euo pipefail

            ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
            ECR_REPOSITORY="${{ env.ECR_REPOSITORY }}"
            IMAGE_TAG="${{ needs.docker-build.outputs.image-tag }}"
            FULL_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
            APP_PORT="${{ env.APP_PORT }}"
            CONTAINER_NAME="nodejs-app"

            echo "[INFO] Authenticating Docker to ECR..."
            aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
              | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

            echo "[INFO] Pulling image: ${FULL_IMAGE}"
            docker pull "${FULL_IMAGE}"

            echo "[INFO] Stopping existing container (if running)..."
            docker stop "${CONTAINER_NAME}" 2>/dev/null || true
            docker rm   "${CONTAINER_NAME}" 2>/dev/null || true

            echo "[INFO] Starting new container..."
            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              -p "${APP_PORT}:${APP_PORT}" \
              "${FULL_IMAGE}"

            echo "[INFO] Container started. Waiting for it to stabilise..."
            sleep 10

            echo "[INFO] Container status:"
            docker ps --filter "name=${CONTAINER_NAME}"

  # ═══════════════════════════════════════════════════════════════
  # Stage 7 — Health Check
  # ═══════════════════════════════════════════════════════════════
  health-check:
    name: "Stage 7 — Health Check"
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Wait for application to be ready
        run: sleep 15

      - name: Application health check
        run: |
          EC2_HOST="${{ secrets.EC2_HOST }}"
          APP_PORT="${{ env.APP_PORT }}"
          MAX_RETRIES=5
          RETRY_INTERVAL=10
          attempt=1

          echo "[INFO] Running health check against http://${EC2_HOST}:${APP_PORT}/"

          until curl --silent --fail --max-time 10 "http://${EC2_HOST}:${APP_PORT}/"; do
            if [[ "${attempt}" -ge "${MAX_RETRIES}" ]]; then
              echo "[ERROR] Health check failed after ${MAX_RETRIES} attempts."
              exit 1
            fi
            echo "[WARN] Attempt ${attempt}/${MAX_RETRIES} failed. Retrying in ${RETRY_INTERVAL}s..."
            attempt=$(( attempt + 1 ))
            sleep "${RETRY_INTERVAL}"
          done

          echo "[INFO] Health check passed. Application is running successfully."
