# SonarQube project configuration
# projectKey must match the key created on the SonarQube server
sonar.projectKey=Rlogical
sonar.projectName=Rlogical

# SonarQube server URL — set here directly so the scanner never reads
# SONAR_HOST_URL from the environment (avoids trailing-newline secret issue)
sonar.host.url=http://3.106.56.33:9000

# Source and test directories (relative to this file's location)
sonar.sources=src
sonar.tests=spec

# Exclusions — skip static assets and dependencies from analysis
sonar.exclusions=node_modules/**,src/static/**

# Encoding
sonar.sourceEncoding=UTF-8
