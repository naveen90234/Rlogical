
# Upstream block for the backend application
upstream app_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Server block: Redirect abc.com -> www.abc.com (HTTP 301 permanent redirect)
server {
    listen 80;
    server_name abc.com;

    # Permanent redirect to www
    return 301 http://www.abc.com$request_uri;
}

# Server block: Reverse proxy www.abc.com -> 127.0.0.1:3000
server {
    listen 80;
    server_name www.abc.com;

    # Logging
    access_log /var/log/nginx/www.abc.com.access.log;
    error_log  /var/log/nginx/www.abc.com.error.log warn;

    location / {
        proxy_pass         http://app_backend;

        # Standard proxy headers so the backend knows the real client info
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Connection / timeout tuning
        proxy_http_version         1.1;
        proxy_set_header           Connection "";
        proxy_connect_timeout      10s;
        proxy_send_timeout         30s;
        proxy_read_timeout         30s;

        # Buffer settings
        proxy_buffering            on;
        proxy_buffer_size          8k;
        proxy_buffers              8 16k;
        proxy_busy_buffers_size    32k;
    }
}