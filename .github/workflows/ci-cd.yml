  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 6 — Deploy on GitHub Actions Runner
  #
  # No SSH / no remote VM connection.
  # Docker runs directly on the self-hosted runner.
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: "Stage 6 — Deploy on Runner"
    runs-on: [ubuntu, ec2, rlogical]
    environment: dev
    needs: push-to-ecr

    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy Docker container on runner
        shell: bash
        run: |
          set -euo pipefail

          ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          ECR_REPO="${{ secrets.ECR_REPOSITORY }}"
          IMAGE_TAG="${{ needs.push-to-ecr.outputs.image-tag }}"
          FULL_IMAGE="${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG}"

          CONTAINER_NAME="nodejs-todo-app-dev"
          APP_PORT="${{ env.APP_PORT }}"

          echo "[INFO] ECR Registry: ${ECR_REGISTRY}"
          echo "[INFO] ECR Repository: ${ECR_REPO}"
          echo "[INFO] Image Tag: ${IMAGE_TAG}"
          echo "[INFO] Full Image: ${FULL_IMAGE}"

          echo "[INFO] Pulling image from ECR..."
          docker pull "${FULL_IMAGE}"

          echo "[INFO] Removing existing container..."
          docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true

          echo "[INFO] Checking whether port ${APP_PORT} is already in use..."

          if sudo ss -ltnp | grep -q ":${APP_PORT} "; then
            echo "[ERROR] Port ${APP_PORT} is already in use."
            echo "[ERROR] Processes using port ${APP_PORT}:"
            sudo ss -ltnp | grep ":${APP_PORT} " || true

            echo "[INFO] Docker containers:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            exit 1
          fi

          echo "[INFO] Starting container..."

          docker run -d \
            --name "${CONTAINER_NAME}" \
            --restart unless-stopped \
            --env NODE_ENV=dev \
            -p "${APP_PORT}:${APP_PORT}" \
            "${FULL_IMAGE}"

          echo "[INFO] Waiting for container startup..."
          sleep 10

          echo "[INFO] Container status:"
          docker ps \
            --filter "name=${CONTAINER_NAME}" \
            --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "[INFO] Container logs:"
          docker logs --tail 50 "${CONTAINER_NAME}"

          echo "[INFO] Deployment completed successfully."


  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 7 — Health Check
  #
  # Health check runs directly on the same GitHub Actions runner.
  # No EC2_HOST / SSH / remote connection required.
  # ═══════════════════════════════════════════════════════════════════════════
  health-check:
    name: "Stage 7 — Health Check"
    runs-on: [ubuntu, ec2, rlogical]
    environment: dev
    needs: deploy

    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    steps:

      - name: Wait for application startup
        run: sleep 10

      - name: Poll application health endpoint
        shell: bash
        run: |
          set -euo pipefail

          URL="http://127.0.0.1:${{ env.APP_PORT }}"
          MAX_RETRIES=6
          RETRY_INTERVAL=10

          echo "[INFO] Health checking: ${URL}"

          for ((attempt=1; attempt<=MAX_RETRIES; attempt++)); do

            if curl --silent --fail --max-time 10 "${URL}"; then
              echo
              echo "[INFO] Health check passed."
              echo "[INFO] Application is live at ${URL}"
              exit 0
            fi

            echo "[WARN] Attempt ${attempt}/${MAX_RETRIES} failed."

            if [[ "${attempt}" -lt "${MAX_RETRIES}" ]]; then
              echo "[WARN] Retrying in ${RETRY_INTERVAL}s..."
              sleep "${RETRY_INTERVAL}"
            fi

          done

          echo "[ERROR] Health check failed after ${MAX_RETRIES} attempts."

          echo "[INFO] Docker container status:"
          docker ps -a \
            --filter "name=nodejs-todo-app-dev" \
            --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "[INFO] Container logs:"
          docker logs --tail 100 nodejs-todo-app-dev || true

          exit 1
