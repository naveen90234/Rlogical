name: CI/CD Pipeline — task-5-cicd

# ─────────────────────────────────────────────────────────────────────────────
# Pipeline scoped to task-5-cicd/
# Runner : rlogical-ec2-runner (self-hosted)
# Labels : ubuntu, ec2, rlogical
# Branch : dev
# Environment: dev
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - dev
    paths:
      - "task-5-cicd/**"
      - ".github/**"

  pull_request:
    branches:
      - dev
    paths:
      - "task-5-cicd/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  IMAGE_NAME: nodejs-todo-app
  APP_PORT: 3000

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 1 — Application Preparation
  # ═══════════════════════════════════════════════════════════════════════════

  prepare:
    name: "Stage 1 — App Preparation"
    runs-on: [ubuntu, ec2, rlogical]
    environment: dev

    defaults:
      run:
        working-directory: task-5-cicd

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: task-5-cicd/package-lock.json

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test


  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 2 — Code Quality (SonarQube)
  #
  # TEMPORARILY DISABLED
  # SonarQube takes too long, so this stage is skipped for now.
  # ═══════════════════════════════════════════════════════════════════════════

  code-quality:
    name: "Stage 2 — Code Quality (SonarQube) [SKIPPED]"
    runs-on: [ubuntu, ec2, rlogical]
    environment: dev
    needs: prepare

    if: false

    steps:
      - name: SonarQube temporarily disabled
        run: echo "SonarQube is temporarily disabled."


  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 3 — Docker Build
  # ═══════════════════════════════════════════════════════════════════════════

  docker-build:
    name: "Stage 3 — Docker Build"
    runs-on: [ubuntu, ec2, rlogical]
    environment: dev
    needs: prepare

    outputs:
      image-tag: ${{ steps.set-tag.outputs.image-tag }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Generate image tag
        id: set-tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "image-tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          echo "Image tag: ${SHORT_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: task-5-cicd
          file: task-5-cicd/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.image-tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image to tarball
        run: |
          docker save "${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.image-tag }}" \
            -o /tmp/docker-image.tar

      - name: Upload image tarball
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/docker-image.tar
          retention-days: 1


  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 4 — Container Security Scan
  # ═══════════════════════════════════════════════════════════════════════════

  security-scan:
    name: "Stage 4 — Security Scan (Trivy)"
    runs-on: [ubuntu, ec2, rlogical]
    environment: dev
    needs: docker-build

    steps:
      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/docker-image.tar

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ needs.docker-build.outputs.image-tag }}"
          format: table
          output: trivy-results.txt
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.txt
          retention-days: 7


  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 5 — Push to AWS ECR
  #
  # IMPORTANT:
  # AWS authentication is enabled using GitHub OIDC.
  # ═══════════════════════════════════════════════════════════════════════════

  push-to-ecr:
    name: "Stage 5 — Push to AWS ECR"
    runs-on: [ubuntu, ec2, rlogical]
    environment: dev

    needs:
      - docker-build
      - security-scan

    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    outputs:
      ecr-registry: ${{ steps.ecr-login.outputs.registry }}
      image-tag: ${{ needs.docker-build.outputs.image-tag }}

    steps:

      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load -i /tmp/docker-image.tar

      # ─────────────────────────────────────────────────────────────────────
      # AWS OIDC Authentication
      # ─────────────────────────────────────────────────────────────────────

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          echo "Verifying AWS identity..."
          aws sts get-caller-identity

      # ─────────────────────────────────────────────────────────────────────
      # ECR Login
      # ─────────────────────────────────────────────────────────────────────

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ─────────────────────────────────────────────────────────────────────
      # Push image
      # ─────────────────────────────────────────────────────────────────────

      - name: Tag and push image to ECR
        run: |
          ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          ECR_REPO="${{ secrets.ECR_REPOSITORY }}"
          IMAGE_TAG="${{ needs.docker-build.outputs.image-tag }}"

          VERSIONED="${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG}"
          LATEST="${ECR_REGISTRY}/${ECR_REPO}:latest"

          echo "Tagging image..."
          docker tag \
            "${{ env.IMAGE_NAME }}:${IMAGE_TAG}" \
            "${VERSIONED}"

          docker tag \
            "${{ env.IMAGE_NAME }}:${IMAGE_TAG}" \
            "${LATEST}"

          echo "Pushing versioned image..."
          docker push "${VERSIONED}"

          echo "Pushing latest image..."
          docker push "${LATEST}"

          echo "Pushed: ${VERSIONED}"
          echo "Pushed: ${LATEST}"


  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 6 — Deploy to EC2
  # ═══════════════════════════════════════════════════════════════════════════

  deploy:
    name: "Stage 6 — Deploy to EC2"
    runs-on: [ubuntu, ec2, rlogical]
    environment: dev

    needs:
      - push-to-ecr

    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    steps:

      # ─────────────────────────────────────────────────────────────────────
      # AWS OIDC Authentication
      # ─────────────────────────────────────────────────────────────────────

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          echo "AWS authentication successful."
          aws sts get-caller-identity

      # ─────────────────────────────────────────────────────────────────────
      # Get ECR registry
      # ─────────────────────────────────────────────────────────────────────

      - name: Get ECR registry
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ─────────────────────────────────────────────────────────────────────
      # Deploy to EC2
      # ─────────────────────────────────────────────────────────────────────

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s

          script: |
            set -euo pipefail

            ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
            ECR_REPO="${{ secrets.ECR_REPOSITORY }}"
            IMAGE_TAG="${{ needs.push-to-ecr.outputs.image-tag }}"

            FULL_IMAGE="${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG}"

            CONTAINER_NAME="nodejs-todo-app-dev"
            APP_PORT="${{ env.APP_PORT }}"
            AWS_REGION="${{ secrets.AWS_REGION }}"

            echo "=========================================="
            echo "Starting deployment"
            echo "=========================================="

            echo "[INFO] ECR Registry: ${ECR_REGISTRY}"
            echo "[INFO] Repository: ${ECR_REPO}"
            echo "[INFO] Image Tag: ${IMAGE_TAG}"
            echo "[INFO] Full Image: ${FULL_IMAGE}"

            echo "[INFO] Logging in to ECR..."

            aws ecr get-login-password \
              --region "${AWS_REGION}" \
              | docker login \
                  --username AWS \
                  --password-stdin "${ECR_REGISTRY}"

            echo "[INFO] ECR login successful."

            echo "[INFO] Pulling image..."

            docker pull "${FULL_IMAGE}"

            echo "[INFO] Image pulled successfully."

            echo "[INFO] Stopping existing container..."

            docker stop "${CONTAINER_NAME}" 2>/dev/null || true

            echo "[INFO] Removing existing container..."

            docker rm "${CONTAINER_NAME}" 2>/dev/null || true

            echo "[INFO] Starting new container..."

            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              --env NODE_ENV=dev \
              -p "${APP_PORT}:${APP_PORT}" \
              "${FULL_IMAGE}"

            echo "[INFO] Waiting for container startup..."

            sleep 10

            echo "[INFO] Container status:"

            docker ps \
              --filter "name=${CONTAINER_NAME}" \
              --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "=========================================="
            echo "Deployment completed successfully"
            echo "=========================================="


  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 7 — Health Check
  # ═══════════════════════════════════════════════════════════════════════════

  health-check:
    name: "Stage 7 — Health Check"
    runs-on: [ubuntu, ec2, rlogical]
    environment: dev

    needs: deploy

    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    steps:

      - name: Wait for application startup
        run: sleep 15

      - name: Poll application health endpoint
        run: |
          URL="http://${{ secrets.EC2_HOST }}:${{ env.APP_PORT }}"

          MAX_RETRIES=6
          RETRY_INTERVAL=10
          attempt=1

          echo "[INFO] Health checking: ${URL}"

          until curl --silent --fail --max-time 10 "${URL}"; do

            if [[ "${attempt}" -ge "${MAX_RETRIES}" ]]; then
              echo "[ERROR] Health check failed after ${MAX_RETRIES} attempts."
              exit 1
            fi

            echo "[WARN] Attempt ${attempt}/${MAX_RETRIES} failed."
            echo "[WARN] Retrying in ${RETRY_INTERVAL}s..."

            attempt=$(( attempt + 1 ))

            sleep "${RETRY_INTERVAL}"

          done

          echo ""
          echo "[INFO] Health check passed."
          echo "[INFO] Application is live at ${URL}"
